[package]
name = "fitwise-local"
version = "0.6.0"
description = "轻衡：本地优先的 AI 减脂管理平台"
authors = ["Fitwise"]
edition = "2021"

[lib]
name = "fitwise_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
keyring = { version = "4.2", default-features = false, features = ["v1", "windows-native-keyring-store"] }
local-ip-address = "0.6"
rand = "0.8"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tokio = { version = "1", features = ["fs", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["limit"] }
zeroize = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
